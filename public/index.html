<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0f" />
  <style>
    html, body {
      background-color: #0a0a0f !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    body.loading {
      overflow: hidden;
    }
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #050508;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: transform 0.8s cubic-bezier(0.85, 0, 0.15, 1), opacity 0.8s ease, visibility 0.8s ease;
      overflow: hidden;
    }
    #preloader.fade-out {
      transform: translateY(-100%);
      opacity: 0;
      visibility: hidden;
    }
    
    /* Glowing background mesh blobs */
    .loader-bg-blob {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
    }
    .blob-1 {
      background: #6c63ff;
      top: 25%;
      left: 25%;
      animation: floatBlob1 8s ease-in-out infinite alternate;
    }
    .blob-2 {
      background: #00d4ff;
      bottom: 25%;
      right: 25%;
      animation: floatBlob2 8s ease-in-out infinite alternate-reverse;
    }
    
    @keyframes floatBlob1 {
      0% { transform: translate(-20px, -20px) scale(0.9); }
      100% { transform: translate(20px, 20px) scale(1.1); }
    }
    @keyframes floatBlob2 {
      0% { transform: translate(20px, 20px) scale(1.1); }
      100% { transform: translate(-20px, -20px) scale(0.9); }
    }

    /* Central Glass Box */
    .loader-card {
      position: relative;
      z-index: 2;
      background: rgba(10, 10, 15, 0.55);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 40px 50px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes cardEntrance {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* SVG circles container */
    .loader-svg-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 130px;
      height: 130px;
    }
    
    .loader-svg-container svg {
      transform: rotate(-90deg); /* Start progress from the top */
    }

    .loader-circle-bar {
      transition: stroke-dashoffset 0.05s linear;
    }

    .loader-circle-dots {
      transform-origin: center;
      animation: spinBackwards 15s linear infinite;
    }
    
    @keyframes spinBackwards {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Center text / logo */
    .loader-center-text {
      position: absolute;
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #00d4ff, #6c63ff, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulseLogo 1.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 10px rgba(108, 99, 255, 0.3));
    }

    @keyframes pulseLogo {
      0% { transform: scale(0.95); opacity: 0.9; }
      100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px rgba(108, 99, 255, 0.5)); }
    }

    /* Status information */
    .loader-status {
      margin-top: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .loader-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.45);
      animation: fadePulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes fadePulse {
      0% { opacity: 0.4; }
      100% { opacity: 0.95; }
    }

    .loader-percentage {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      margin-top: 6px;
      background: linear-gradient(90deg, #00d4ff, #6c63ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Progress bar */
    .loader-bar-container {
      width: 120px;
      height: 2px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      margin-top: 16px;
      overflow: hidden;
    }

    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d4ff, #6c63ff, #ff6b6b);
      border-radius: 2px;
      transition: width 0.05s linear;
    }
  </style>
  <meta name="description" content="Giriprasath S - Python Developer | AI & Cloud Enthusiast" />

  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>

<body class="loading">
  <div id="preloader">
    <div class="loader-bg-blob blob-1"></div>
    <div class="loader-bg-blob blob-2"></div>
    <div class="loader-card">
      <div class="loader-svg-container">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <defs>
            <linearGradient id="loader-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00d4ff" />
              <stop offset="50%" stop-color="#6c63ff" />
              <stop offset="100%" stop-color="#ff6b6b" />
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="4" />
          <circle class="loader-circle-bar" cx="60" cy="60" r="50" fill="none" stroke="url(#loader-grad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16" />
          <circle class="loader-circle-dots" cx="60" cy="60" r="42" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" stroke-dasharray="4, 4" />
        </svg>
        <div class="loader-center-text">GS</div>
      </div>
      <div class="loader-status">
        <div class="loader-label">INITIALIZING SYSTEM</div>
        <div class="loader-percentage" id="loader-percent">0%</div>
        <div class="loader-bar-container">
          <div class="loader-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function() {
      var percentText = document.getElementById("loader-percent");
      var circleBar = document.querySelector(".loader-circle-bar");
      var barFill = document.querySelector(".loader-bar-fill");
      var duration = 1500; // duration in ms
      var start = null;

      function updateLoader(timestamp) {
        if (!start) start = timestamp;
        var elapsed = timestamp - start;
        var progress = Math.min(elapsed / duration, 1);
        var percentage = Math.floor(progress * 100);

        if (percentText) {
          percentText.textContent = percentage + "%";
        }
        if (circleBar) {
          var offset = 314.16 - (314.16 * progress);
          circleBar.style.strokeDashoffset = offset;
        }
        if (barFill) {
          barFill.style.width = percentage + "%";
        }

        if (progress < 1) {
          requestAnimationFrame(updateLoader);
        }
      }
      requestAnimationFrame(updateLoader);
    })();
  </script>
